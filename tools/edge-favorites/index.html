<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Managed Favorites Generator</title>

  <style>
    :root {
      --bg: #ffffff;
      --text: #000000;
      --panel: #f5f5f5;
      --border: #cccccc;
      --hover: #e0e0e0;
      --muted: #666666;
    }

    body.dark {
      --bg: #0f1115;
      --text: #e6e6e6;
      --panel: #1b1e24;
      --border: #333333;
      --hover: #2f3542;
      --muted: #aaaaaa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    input,
    select,
    textarea {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px;
      border-radius: 4px;
    }

    textarea {
      width: 100%;
      height: 260px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      resize: vertical;
    }

    button {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      background: var(--hover);
    }

    button:disabled {
      cursor: default;
      opacity: 0.75;
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-top: 16px;
    }

    .panel {
      background: var(--panel);
      padding: 12px;
      border-radius: 6px;
    }

    .tree-item {
      margin-left: 16px;
      padding: 4px;
      border-radius: 4px;
    }

    .tree-item.drag-over {
      background: var(--hover);
    }

    .tree-item input {
      border: none;
      background: transparent;
      color: inherit;
      font-family: inherit;
      width: 220px;
    }

    .tree-item input:focus {
      outline: 1px solid var(--border);
      background: var(--bg);
    }

    .root-drop {
      border: 2px dashed var(--border);
      padding: 8px;
      margin-bottom: 12px;
      text-align: center;
      border-radius: 6px;
    }

    .output-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .hint {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 8px;
    }

    /* Visualizer */

    .edge-menu {
      display: flex;
      background: #1e1e1e;
      color: #ffffff;
      border-radius: 6px;
      overflow-x: auto;
    }

    .edge-column {
      min-width: 240px;
      border-right: 1px solid #333333;
    }

    .edge-item {
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      cursor: default;
    }

    .edge-item:hover {
      background: #333333;
    }

    @media (max-width: 800px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<h1>Managed Favorites Generator</h1>

<div class="row">
  <button type="button" onclick="toggleTheme()">🌙 / ☀️ Theme</button>

  <label>
    Import Windows JSON:
    <input type="file" accept=".json,application/json" onchange="importJson(event)" />
  </label>
</div>

<h2>Top-level name</h2>
<input id="toplevelName" placeholder="My managed favorites folder" />

<h2>Add item</h2>
<div class="row">
  <input id="itemName" placeholder="Name" />
  <input id="itemUrl" placeholder="URL (leave empty = folder)" />
  <select id="parentSelect"></select>
  <button type="button" onclick="addItem()">Add</button>
</div>

<div class="layout">

  <div class="panel">
    <h2>Editor</h2>

    <div id="rootDrop" class="root-drop">
      Drop here to move item to top-level
    </div>

    <div id="tree"></div>
  </div>

  <div class="panel">
    <h2>Visualizer</h2>
    <div id="preview"></div>
  </div>

</div>

<h2>Generated JSON</h2>
<textarea id="output" readonly></textarea>

<div class="output-actions">
  <button type="button" onclick="copyJson(this)">Copy JSON</button>
  <button type="button" onclick="downloadWindowsJson()">Download for Windows (.json)</button>
  <button type="button" onclick="downloadMacPlist()">Download for macOS (.plist)</button>
</div>

<p class="hint">
  macOS: deploy the downloaded file with an Intune macOS Preference file profile
  using the preference domain <strong>com.microsoft.Edge</strong>.
</p>

<script src="app.js"></script>
</body>
</html>
